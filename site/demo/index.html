<style>
:root{
  --bg:#fbf7f2; --panel:#ffffff; --ink:#2b2118; --muted:#6f6257; --line:#e8ddd1;
  --brand:#b4541a; --brand-ink:#ffffff; --brand-soft:#fbe9dc; --ok:#1f7a4d; --ok-soft:#e1f3e9;
  --warn:#9a5b00; --warn-soft:#fff1d6; --bad:#b3261e; --bad-soft:#fde4e1; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1612; --panel:#251e18; --ink:#f3eae1; --muted:#b3a597; --line:#3b3129;
    --brand:#e27a3a; --brand-ink:#1b1612; --brand-soft:#3b2717; --ok:#5cc58f; --ok-soft:#173226;
    --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c19; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1612; --panel:#251e18; --ink:#f3eae1; --muted:#b3a597; --line:#3b3129;
  --brand:#e27a3a; --brand-ink:#1b1612; --brand-soft:#3b2717; --ok:#5cc58f; --ok-soft:#173226;
  --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c19; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand)}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.2px;color:var(--ink);text-decoration:none}

@media (max-width:640px){nav.tabs .sh{display:inline}}
nav.tabs a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}

@media (max-width:820px){.split,.g2,.g3{grid-template-columns:1fr}.sticky{position:static}}

@media (max-width:640px){
  .topin{padding:8px 12px 4px;gap:4px}

}

label.f > input,label.f > select,label.f > textarea{margin-top:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}

.frow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center;margin-bottom:8px}

  body > *:not(#print){display:none!important}
  body{background:#fff}
  #print{display:block;color:#000;background:#fff;font-size:12pt}
  #print table th,#print table td{border-bottom:1px solid #999;color:#000}

<div id="banner-slot"></div>
<header class="top"><div class="topin">
  <a class="logo" href="#calc" aria-label="PourPrice home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#b4541a"/><path d="M32 10c5 7 8 11 8 16a8 8 0 0 1-16 0c0-5 3-9 8-16z" fill="#ffd48a"/><rect x="20" y="36" width="24" height="18" rx="3" fill="#fff6ea"/></svg>
    PourPrice
  </a>
  <nav class="tabs" id="tabs">
    <a href="#calc" data-tab="calc"><span class="lg">Calculator</span><span class="sh">Calc</span></a>
    <a href="#recipes" data-tab="recipes">Recipes</a>
    <a href="#batches" data-tab="batches">Batches</a>

  </nav>

<script>
"use strict";
const BUILD = {"edition": "demo", "buyUrl": "https://YOUR-STORE.gumroad.com/l/pourprice", "sw": "sw.js"};
const EDITION = (typeof BUILD !== "undefined" && BUILD.edition) || "full";
const BUY_URL = (typeof BUILD !== "undefined" && BUILD.buyUrl) || "#";
const VERSION = "1.0.0";
const IS_DEMO = EDITION === "demo";
const DEMO_LIMITS = { recipes: 2, batches: 3 };
const STORAGE_KEY = IS_DEMO ? "pourprice-demo-v1" : "pourprice-v1";

/* ---------- units & formatting ---------- */
const G_PER = { g: 1, kg: 1000, oz: 28.349523125, lb: 453.59237 };
const TYPES = {
  wax: { label: "Wax", plural: "Waxes", measure: "weight" },
  fragrance: { label: "Fragrance oil", plural: "Fragrance oils", measure: "weight" },
  wick: { label: "Wick", plural: "Wicks", measure: "each" },
  vessel: { label: "Vessel / container", plural: "Vessels & containers", measure: "each" },
  other: { label: "Other (dye, lid, label, box…)", plural: "Other supplies", measure: "either" }
};
const CURRENCIES = ["USD","EUR","GBP","CAD","AUD","NZD","ZAR","INR","SGD","CHF","SEK","NOK","DKK","PLN","MXN","BRL","JPY","PHP","MYR","AED"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function num(v, d = 0){ const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : d; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function round(n, dp){ const f = Math.pow(10, dp); return Math.round(n * f) / f; }
function wUnit(){ return S.settings.unit; }
function toDisp(g){ return wUnit() === "oz" ? g / G_PER.oz : g; }
function fromDisp(v){ return wUnit() === "oz" ? num(v) * G_PER.oz : num(v); }
function dispVal(g){ return g === "" || g == null ? "" : String(round(toDisp(g), wUnit() === "oz" ? 2 : 1)); }
function fmtW(g){
  if (!Number.isFinite(g)) return "–";
  if (wUnit() === "oz"){ const oz = round(g / G_PER.oz, 2).toFixed(2) + " oz"; return Math.abs(g) >= 2 * G_PER.lb ? oz + " (" + round(g / G_PER.lb, 2).toFixed(2) + " lb)" : oz; }
  if (Math.abs(g) >= 10000) return round(g / 1000, 2).toFixed(2) + " kg";
  return round(g, 1).toFixed(1) + " g";
}
let _cf = null, _cfKey = "";
function money(n){
  if (!Number.isFinite(n)) return "–";
  const c = S.settings.currency;
  if (_cfKey !== c){ try { _cf = new Intl.NumberFormat(undefined, { style: "currency", currency: c }); } catch(e){ _cf = null; } _cfKey = c; }
  return _cf ? _cf.format(n) : n.toFixed(2);
}
function pct(n){ return Number.isFinite(n) ? round(n * 100, 1) + "%" : "–"; }
function todayISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, days){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "";
  const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + Math.round(num(days))); return d.toISOString().slice(0, 10);
}
function fmtDate(iso){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "–";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

/* ---------- state ---------- */
function defaultState(){
  return {
    v: 1,
    settings: {
      currency: "USD", unit: "oz", flMode: "wax", fillFactor: 0.86, overagePct: 0,
      laborRate: 15, overheadPerCandle: 0, wholesaleMult: 2, retailMult: 2,
      feePct: 0, feeFixed: 0, targetMargin: 50, defaultCure: 14, theme: "auto", businessName: ""
    },
    materials: [], recipes: [], batches: [], lastBackup: null, created: new Date().toISOString()
  };
}
let S = defaultState();
let storageOK = true;
function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){ S = normalize(JSON.parse(raw)); }
  } catch(e){ storageOK = false; }
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; toast("Could not save – browser storage is blocked or full. Export a backup!"); }
}
function normalize(d){
  const base = defaultState();
  if (!d || typeof d !== "object") return base;
  const out = { ...base, ...d };
  out.settings = { ...base.settings, ...(d.settings || {}) };
  out.materials = Array.isArray(d.materials) ? d.materials.filter(m => m && m.id && TYPES[m.type]) : [];
  out.recipes = Array.isArray(d.recipes) ? d.recipes.filter(r => r && r.id).map(r => ({ fragrances: [], extras: [], ...r })) : [];
  out.batches = Array.isArray(d.batches) ? d.batches.filter(b => b && b.id) : [];
  if (!CURRENCIES.includes(out.settings.currency)) { try { new Intl.NumberFormat(undefined, { style: "currency", currency: out.settings.currency }); } catch(e){ out.settings.currency = "USD"; } }
  if (!["g","oz"].includes(out.settings.unit)) out.settings.unit = "oz";
  if (!["wax","total"].includes(out.settings.flMode)) out.settings.flMode = "wax";
  return out;
}
const mat = id => S.materials.find(m => m.id === id);
const rec = id => S.recipes.find(r => r.id === id);

/* ---------- material maths ---------- */
function measureOf(m){ if (!m) return "each"; const t = TYPES[m.type].measure; return t === "either" ? (m.qtyUnit === "each" ? "each" : "weight") : t; }
/** cost per gram (weight materials) or per piece (each materials) */
function unitCost(m){
  if (!m) return 0;
  const paid = num(m.pricePaid), q = num(m.qtyPurchased);
  if (q <= 0) return 0;
  if (measureOf(m) === "each") return paid / q;
  return paid / (q * (G_PER[m.qtyUnit] || 1));
}
function unitCostLabel(m){
  if (measureOf(m) === "each") return money(unitCost(m)) + " each";
  return wUnit() === "oz" ? money(unitCost(m) * G_PER.oz) + " / oz" : money(unitCost(m) * 1000) + " / kg";
}
function stockLabel(m){
  if (m.stock == null || m.stock === "") return "";
  return measureOf(m) === "each" ? round(num(m.stock), 2) + " pcs" : fmtW(num(m.stock));
}

/* ---------- core candle maths ----------
   fill weight (wax + fragrance) per vessel = water weight × fill factor (default 0.86).
   flMode "wax":   fragrance = wax × FL        → wax = blend ÷ (1 + FL)
   flMode "total": fragrance = blend × FL      → wax = blend × (1 − FL)                */
function splitBlend(blendG, flPct, mode){
  const fl = Math.max(0, num(flPct)) / 100;
  if (mode === "total"){ const fo = blendG * fl; return { wax: blendG - fo, fo }; }
  const wax = blendG / (1 + fl); return { wax, fo: wax * fl };
}
function recipeFill(r){
  if (num(r.fillOverride) > 0) return num(r.fillOverride);
  const v = mat(r.vesselId);
  return v ? num(v.waterWeight) * num(S.settings.fillFactor, 0.86) : 0;
}
function calcRecipe(r, qty = 1){
  const st = S.settings;
  qty = Math.max(0, num(qty, 1));
  const fill = recipeFill(r);
  const over = 1 + Math.max(0, num(st.overagePct)) / 100;
  const perCandleBlend = fill * over;
  const { wax, fo } = splitBlend(perCandleBlend, r.fl, st.flMode);
  const frs = (r.fragrances || []).filter(f => f.id);
  const pctSum = frs.reduce((a, f) => a + num(f.pct), 0);
  const fragrances = frs.map(f => {
    const share = pctSum > 0 ? num(f.pct) / pctSum : 0;
    const g = fo * share; const m = mat(f.id);
    return { id: f.id, name: m ? m.name : "(deleted)", pct: num(f.pct), g, total: g * qty, cost: g * unitCost(m) };
  });
  const waxM = mat(r.waxId), wickM = mat(r.wickId), vesM = mat(r.vesselId);
  const wicks = Math.max(0, num(r.wicksPerCandle, 1));
  const lines = [];
  lines.push({ label: "Wax" + (waxM ? " – " + waxM.name : ""), cost: wax * unitCost(waxM) });
  fragrances.forEach(f => lines.push({ label: "Fragrance – " + f.name, cost: f.cost }));
  if (wickM) lines.push({ label: "Wick – " + wickM.name + (wicks !== 1 ? " ×" + wicks : ""), cost: wicks * unitCost(wickM) });
  if (vesM) lines.push({ label: "Vessel – " + vesM.name, cost: unitCost(vesM) });
  (r.extras || []).forEach(x => { const m = mat(x.id); if (m) lines.push({ label: m.name, cost: num(x.qty) * unitCost(m) }); });
  const materials = lines.reduce((a, l) => a + l.cost, 0);
  const labor = Math.max(0, num(r.laborMin)) / 60 * num(st.laborRate);
  const overhead = num(st.overheadPerCandle);
  const cost = materials + labor + overhead;
  const wholesale = cost * num(st.wholesaleMult, 2);
  const retail = wholesale * num(st.retailMult, 2);
  const price = num(r.price) > 0 ? num(r.price) : retail;
  const p = pricing(price, cost);
  const warnings = [];
  if (!fill) warnings.push("Pick a vessel (with its water weight) or enter a fill weight.");
  if (frs.length && Math.abs(pctSum - 100) > 0.01) warnings.push("Fragrance blend adds up to " + round(pctSum, 2) + "% – amounts are scaled to 100%.");
  if (waxM && num(waxM.maxFl) > 0 && num(r.fl) > num(waxM.maxFl)) warnings.push("Fragrance load " + num(r.fl) + "% is above this wax's max of " + num(waxM.maxFl) + "%.");
  if (num(r.fl) > 15) warnings.push("Fragrance loads above ~12% exceed what many waxes can hold – check your wax's spec sheet.");
  return {
    fill, perCandleBlend, wax, fo, fragrances, wicks, qty,
    totals: { blend: perCandleBlend * qty, wax: wax * qty, fo: fo * qty, wicks: wicks * qty, vessels: vesM ? qty : 0 },
    lines, materials, labor, overhead, cost, wholesale, retail, price, priceIsCustom: num(r.price) > 0, ...p,
    targetPrice: priceForMargin(cost, num(st.targetMargin) / 100), warnings
  };
}
function pricing(price, cost){
  const st = S.settings;
  const fees = price > 0 ? price * num(st.feePct) / 100 + num(st.feeFixed) : 0;
  const profit = price - cost - fees;
  return { fees, profit, margin: price > 0 ? profit / price : NaN, markup: cost > 0 ? price / cost : NaN };
}
/** price so that (price − cost − fees) / price = margin */
function priceForMargin(cost, m){
  const st = S.settings;
  const denom = 1 - num(st.feePct) / 100 - m;
  if (denom <= 0) return NaN;
  return (cost + num(st.feeFixed)) / denom;
}

/* ---------- UI helpers ---------- */
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const dlg = document.getElementById("dlg");
function openDialog(title, body, footer, onReady){
  dlg.innerHTML = `<div class="dlg-h"><h2 style="margin:0">${esc(title)}</h2><button class="btn ghost sm" data-close aria-label="Close">✕</button></div><div class="dlg-b">${body}</div>${footer ? `<div class="dlg-f">${footer}</div>` : ""}`;
  if (!dlg.open) dlg.showModal();
  dlg.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dlg.close());
  onReady && onReady(dlg);
}
function confirmBox(msg, okLabel = "Delete"){
  return new Promise(res => {
    openDialog("Are you sure?", `<p>${esc(msg)}</p>`, `<button class="btn" data-close>Cancel</button><button class="btn primary" id="cfok">${esc(okLabel)}</button>`, d => {
      let done = false;
      d.querySelector("#cfok").onclick = () => { done = true; d.close(); res(true); };
      d.addEventListener("close", () => { if (!done) res(false); }, { once: true });
    });
  });
}
function opts(list, sel, placeholder){
  return (placeholder != null ? `<option value="">${esc(placeholder)}</option>` : "") +
    list.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(sel) ? "selected" : ""}>${esc(o.t)}</option>`).join("");
}
function matOpts(type, sel, placeholder = "— none —"){
  return opts(S.materials.filter(m => m.type === type).map(m => ({ v: m.id, t: m.name })), sel, placeholder);
}
function download(name, text, type){
  const blob = new Blob([text], { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function buyLink(text = "Get the full version"){ return `<a href="${esc(BUY_URL)}" target="_blank" rel="noopener">${esc(text)}</a>`; }
function demoBlock(what){
  openDialog("Demo limit reached", `<p>The free demo lets you save up to ${DEMO_LIMITS.recipes} recipes and ${DEMO_LIMITS.batches} batches.</p><p>The full version is unlimited, works offline and is a one-time purchase – no subscription.</p>`,
    `<button class="btn" data-close>Not now</button><a class="btn primary" href="${esc(BUY_URL)}" target="_blank" rel="noopener">Get PourPrice</a>`);
}

/* ---------- router ---------- */
const VIEWS = { calc: viewCalc, recipes: viewRecipes, recipe: viewRecipe, batches: viewBatches, materials: viewMaterials, settings: viewSettings };
function route(){
  const [name, arg] = (location.hash.slice(1) || "calc").split("/");
  const v = VIEWS[name] ? name : "calc";
  const tab = v === "recipe" ? "recipes" : v;
  document.querySelectorAll("#tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const app = document.getElementById("app");
  app.innerHTML = "";
  VIEWS[v](app, arg ? decodeURIComponent(arg) : undefined);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

  const totalCandles = S.batches.reduce((a, b) => a + num(b.qty), 0);

  app.innerHTML = `<div class="row" style="align-items:center;margin-bottom:8px"><h1 style="margin:0">Batch log</h1><div class="shrink btns"><button class="btn" id="csv" ${S.batches.length ? "" : "disabled"}>Export CSV</button><button class="btn primary" id="newb">+ Log batch</button></div></div>

  </div>
  <div class="card tablewrap">${shown.length ? `<table><thead><tr><th>Poured</th><th>Recipe</th><th class="num">Qty</th><th>Ready</th><th>Status</th><th>Hot throw</th></tr></thead><tbody>

function stars(name, val){ return `<span class="stars" data-stars="${name}">${[1,2,3,4,5].map(i => `<button type="button" data-v="${i}" class="${i <= num(val) ? "on" : ""}" aria-label="${i} star${i > 1 ? "s" : ""}">★</button>`).join("")}</span>`; }
function editBatch(batchId, recipeId, qty){
  const isNew = !batchId;
  if (isNew && IS_DEMO && S.batches.length >= DEMO_LIMITS.batches) return demoBlock();
  const b = isNew ? { id: uid(), recipeId, date: todayISO(), qty: qty || 12, cureDays: num(S.settings.defaultCure, 14), lot: "", waxTemp: "", pourTemp: "", notes: "", cold: 0, hot: 0, deducted: false } : { ...S.batches.find(x => x.id === batchId) };
  if (!isNew && !b.id) return;
  const tempUnit = S.settings.unit === "oz" ? "°F" : "°C";
  openDialog(isNew ? "Log a batch" : "Batch – " + (b.recipeName || ""), `
    <div class="row">
      ${isNew ? `<label class="f">Recipe<select id="b_recipe">${opts(S.recipes.map(r => ({ v: r.id, t: r.name })), b.recipeId)}</select></label>` : ""}
      <label class="f">Candles<input id="b_qty" type="number" inputmode="numeric" min="1" step="1" value="${esc(b.qty)}"></label>
    </div>
    <div class="row">
      <label class="f">Pour date<input id="b_date" type="date" value="${esc(b.date)}"></label>
      <label class="f">Cure days<input id="b_cure" type="number" inputmode="numeric" min="0" step="1" value="${esc(b.cureDays)}"></label>
      <label class="f">Batch / lot #<input id="b_lot" value="${esc(b.lot)}" maxlength="60"></label>
    </div>
    <div class="row">
      <label class="f">Fragrance added at (${tempUnit})<input id="b_wt" value="${esc(b.waxTemp)}" inputmode="decimal" maxlength="20"></label>
      <label class="f">Poured at (${tempUnit})<input id="b_pt" value="${esc(b.pourTemp)}" inputmode="decimal" maxlength="20"></label>
    </div>
    <div class="row">
      <div><div class="small muted" style="font-weight:600">Cold throw</div>${stars("cold", b.cold)}</div>
      <div><div class="small muted" style="font-weight:600">Hot throw</div>${stars("hot", b.hot)}</div>
    </div>
    <label class="f" style="margin-top:10px">Notes / burn test<textarea id="b_notes" placeholder="Frosting, wet spots, tunnelling, soot, melt pool at 1h/2h/4h…">${esc(b.notes)}</textarea></label>
    ${isNew ? `<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="b_deduct" style="width:auto;min-height:0" ${S.materials.some(m => m.stock !== "" && m.stock != null) ? "checked" : ""}> Deduct materials from stock</label><p class="small muted" style="margin:4px 0 0">Only affects materials where you track stock.</p>`
      : `<div class="note info small">Saved at logging: ${esc(b.recipeName)} · cost ${money(num(b.costEach))} per candle · ${b.deducted ? "stock was deducted" : "stock not deducted"}.</div>`}
  `, `${isNew ? "" : `<button class="btn danger left" id="b_del">Delete</button><button class="btn" id="b_print">Print</button>`}<button class="btn" data-close>Cancel</button><button class="btn primary" id="b_save">${isNew ? "Log batch" : "Save"}</button>`, d => {
    d.querySelectorAll("[data-stars]").forEach(g => g.querySelectorAll("button").forEach(btn => btn.onclick = () => {
      const k = g.dataset.stars; b[k] = b[k] === +btn.dataset.v ? 0 : +btn.dataset.v;
      g.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v <= b[k]));
    }));
    d.querySelector("#b_save").onclick = () => {
      const qtyV = Math.floor(num(d.querySelector("#b_qty").value));
      if (!(qtyV > 0)) return toast("Enter the number of candles");
      const date = d.querySelector("#b_date").value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast("Enter a pour date");
      Object.assign(b, { qty: qtyV, date, cureDays: Math.max(0, Math.round(num(d.querySelector("#b_cure").value))), lot: d.querySelector("#b_lot").value.trim(),
        waxTemp: d.querySelector("#b_wt").value.trim(), pourTemp: d.querySelector("#b_pt").value.trim(), notes: d.querySelector("#b_notes").value });
      if (isNew){
        const r = rec(d.querySelector("#b_recipe").value); if (!r) return toast("Choose a recipe");
        const c = calcRecipe(r, qtyV);
        Object.assign(b, { recipeId: r.id, recipeName: r.name, costEach: round(c.cost, 4), fl: num(r.fl), created: new Date().toISOString(),
          weights: { wax: round(c.totals.wax, 2), fragrances: c.fragrances.map(f => ({ name: f.name, g: round(f.total, 2) })) } });
        if (d.querySelector("#b_deduct").checked){
          const ded = [];
          const take = (id, amt) => { const m = mat(id); if (m && m.stock !== "" && m.stock != null && amt > 0){ m.stock = round(num(m.stock) - amt, 3); ded.push({ id, amt: round(amt, 3) }); } };
          take(r.waxId, c.totals.wax); c.fragrances.forEach(f => take(f.id, f.total));
          take(r.wickId, c.totals.wicks); take(r.vesselId, c.totals.vessels);
          (r.extras || []).forEach(x => take(x.id, num(x.qty) * qtyV));
          b.deducted = ded.length > 0; b.deductions = ded;
          const neg = ded.map(x => mat(x.id)).filter(m => num(m.stock) < 0);
          if (neg.length) setTimeout(() => toast("Stock now below zero: " + neg.map(m => m.name).join(", ")), 300);
        }
        S.batches.push(b);
      } else {
        const i = S.batches.findIndex(x => x.id === b.id); S.batches[i] = b;
      }
      save(); d.close(); toast(isNew ? "Batch logged" : "Batch saved");
      if (isNew) location.hash = "#batches"; else route();
    };
    const del = d.querySelector("#b_del");
    if (del) del.onclick = async () => {
      const restore = b.deducted && b.deductions && b.deductions.length;
      if (!(await confirmBox(`Delete this batch${restore ? " and put its materials back into stock" : ""}?`))) return;
      if (restore) b.deductions.forEach(x => { const m = mat(x.id); if (m && m.stock !== "" && m.stock != null) m.stock = round(num(m.stock) + num(x.amt), 3); });
      S.batches = S.batches.filter(x => x.id !== b.id); save(); toast("Batch deleted"); route();
    };
    const pr = d.querySelector("#b_print");
    if (pr) pr.onclick = () => { const r = rec(b.recipeId); printSheet(r, b.qty, b); };
  });
}
function exportCSV(){
  const head = ["Pour date", "Recipe", "Lot", "Candles", "Cure days", "Ready date", "Cost per candle", "Batch cost", "Fragrance load %", "Wax (g)", "Fragrance oils (g)", "Fragrance added at", "Poured at", "Cold throw", "Hot throw", "Notes"];
  const q = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = S.batches.map(b => [b.date, b.recipeName, b.lot, b.qty, b.cureDays, addDays(b.date, b.cureDays), round(num(b.costEach), 2), round(num(b.costEach) * num(b.qty), 2), b.fl, b.weights ? b.weights.wax : "", b.weights ? b.weights.fragrances.map(f => f.name + ": " + f.g).join("; ") : "", b.waxTemp, b.pourTemp, b.cold || "", b.hot || "", b.notes]);
  download("pourprice-batches-" + todayISO() + ".csv", "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n"), "text/csv;charset=utf-8");
}
function printSheet(r, qty, b){
  const p = document.getElementById("print");
  let wax, frs, wicks = 0, vessels = 0, name, fl;
  if (b && b.weights){ wax = b.weights.wax; frs = b.weights.fragrances; name = b.recipeName; fl = b.fl; }
  if (r && (!b || !b.weights)){ const c = calcRecipe(r, qty); wax = c.totals.wax; frs = c.fragrances.map(f => ({ name: f.name, g: f.total })); name = r.name; fl = r.fl; }
  if (r){ const c = calcRecipe(r, qty); wicks = r.wickId ? c.totals.wicks : 0; vessels = c.totals.vessels; }
  if (wax == null){ toast("Nothing to print"); return; }
  const tu = S.settings.unit === "oz" ? "°F" : "°C";
  p.innerHTML = `<div style="padding:10mm">
    <h1 style="margin:0">${esc(S.settings.businessName || "Pour sheet")}</h1>
    <h2 style="margin:4px 0 12px">${esc(name)} – ${esc(qty)} candle${qty == 1 ? "" : "s"}</h2>
    <p>Date: ${b ? fmtDate(b.date) : "____________"} &nbsp; Lot: ${b && b.lot ? esc(b.lot) : "________"} &nbsp; Fragrance load: ${esc(fl)}%</p>
    <table><thead><tr><th></th><th>Item</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      <tr><td><span class="box"></span></td><td>Wax</td><td style="text-align:right"><b>${fmtW(wax)}</b></td></tr>
      ${frs.map(f => `<tr><td><span class="box"></span></td><td>${esc(f.name)}</td><td style="text-align:right"><b>${fmtW(f.g)}</b></td></tr>`).join("")}
      ${wicks ? `<tr><td><span class="box"></span></td><td>Wicks</td><td style="text-align:right"><b>${round(wicks, 2)}</b></td></tr>` : ""}
      ${vessels ? `<tr><td><span class="box"></span></td><td>Vessels</td><td style="text-align:right"><b>${vessels}</b></td></tr>` : ""}
    </tbody></table>
    <p style="margin-top:16px">Fragrance added at: ${b && b.waxTemp ? esc(b.waxTemp) + " " + tu : "________"} &nbsp; Poured at: ${b && b.pourTemp ? esc(b.pourTemp) + " " + tu : "________"} &nbsp; Ready: ${b ? fmtDate(addDays(b.date, b.cureDays)) : "________"}</p>
    <p>Notes:</p><div style="white-space:pre-wrap;min-height:40mm;border:1px solid #999;padding:6px">${b ? esc(b.notes) : ""}</div>
    <p style="font-size:9pt;color:#555">Made with PourPrice</p></div>`;
  if (dlg.open) dlg.close();
  setTimeout(() => window.print(), 50);
}

function editMaterial(id, presetType){
  const isNew = !id;
  const m = isNew ? { id: uid(), type: presetType || "wax", name: "", pricePaid: "", qtyPurchased: "", qtyUnit: S.settings.unit === "oz" ? "lb" : "kg", stock: "", lowAt: "", waterWeight: "", maxFl: "", notes: "" } : { ...mat(id) };
  const render = () => {
    const meas = measureOf(m);
    const unitChoices = m.type === "other" ? ["g","kg","oz","lb","each"] : meas === "each" ? ["each"] : ["g","kg","oz","lb"];
    if (!unitChoices.includes(m.qtyUnit)) m.qtyUnit = unitChoices[meas === "each" ? 0 : (S.settings.unit === "oz" ? 3 : 1)];
    const stockUnit = measureOf(m) === "each" ? "pcs" : wUnit();
    openDialog(isNew ? "Add material" : "Edit material", `
      <div class="row">
        <label class="f">Type<select id="m_type">${opts(Object.keys(TYPES).map(k => ({ v: k, t: TYPES[k].label })), m.type)}</select></label>
        <label class="f">Name<input id="m_name" value="${esc(m.name)}" maxlength="120" placeholder="${m.type === "wax" ? "e.g. Soy 464" : m.type === "fragrance" ? "e.g. Lavender & Sage" : m.type === "wick" ? "e.g. CD-10" : m.type === "vessel" ? "e.g. 9 oz amber jar" : "e.g. Gold lid"}"></label>
      </div>
      <div class="row">
        <label class="f">Price paid (${esc(S.settings.currency)})<input id="m_price" type="number" inputmode="decimal" min="0" step="any" value="${esc(m.pricePaid)}" placeholder="incl. shipping"></label>
        <label class="f">Quantity received<input id="m_qty" type="number" inputmode="decimal" min="0" step="any" value="${esc(m.qtyPurchased)}"></label>
        <label class="f" style="max-width:130px">Unit<select id="m_unit">${opts(unitChoices.map(u => ({ v: u, t: u === "each" ? "pieces" : u })), m.qtyUnit)}</select></label>
      </div>
      ${m.type === "fragrance" ? `<p class="small muted" style="margin-top:-4px">Fragrance oil is measured by <b>weight</b>. If your bottle is labelled in ml, weigh its contents (or use the supplier's listed weight).</p>` : ""}
      ${m.type === "vessel" ? `<label class="f">Water weight (${wUnit()}) – fill the empty vessel with water to where your wax will sit and weigh the water<input id="m_ww" type="number" inputmode="decimal" min="0" step="any" value="${esc(dispVal(m.waterWeight))}"></label>` : ""}
      ${m.type === "wax" ? `<label class="f">Max fragrance load (%) <span class="muted">from the spec sheet, optional</span><input id="m_maxfl" type="number" inputmode="decimal" min="0" max="40" step="any" value="${esc(m.maxFl)}"></label>` : ""}
      <div class="row">
        <label class="f">In stock (${stockUnit}) <span class="muted">optional</span><input id="m_stock" type="number" inputmode="decimal" step="any" value="${esc(meas === "each" ? m.stock : dispVal(m.stock))}" placeholder="not tracked"></label>
        <label class="f">Warn when below (${stockUnit})<input id="m_low" type="number" inputmode="decimal" min="0" step="any" value="${esc(meas === "each" ? m.lowAt : dispVal(m.lowAt))}"></label>
      </div>
      <label class="f">Supplier / notes<textarea id="m_notes">${esc(m.notes)}</textarea></label>
      <div class="note info small" id="m_uc"></div>`,
      `${isNew ? "" : `<button class="btn danger left" id="m_del">Delete</button>`}<button class="btn" data-close>Cancel</button><button class="btn primary" id="m_save">Save</button>`, d => {
        const collect = () => {
          const measNow = measureOf(m);
          m.name = d.querySelector("#m_name").value; m.pricePaid = d.querySelector("#m_price").value; m.qtyPurchased = d.querySelector("#m_qty").value; m.qtyUnit = d.querySelector("#m_unit").value;
          const sv = d.querySelector("#m_stock").value, lv = d.querySelector("#m_low").value;
          m.stock = sv === "" ? "" : measNow === "each" ? num(sv) : fromDisp(sv);
          m.lowAt = lv === "" ? "" : measNow === "each" ? num(lv) : fromDisp(lv);
          const ww = d.querySelector("#m_ww"); if (ww) m.waterWeight = ww.value === "" ? "" : fromDisp(ww.value);
          const mf = d.querySelector("#m_maxfl"); if (mf) m.maxFl = mf.value;
          m.notes = d.querySelector("#m_notes").value;
        };
        const showUC = () => { collect(); d.querySelector("#m_uc").textContent = num(m.qtyPurchased) > 0 ? "Unit cost: " + unitCostLabel(m) : "Enter price and quantity to see the unit cost."; };
        d.querySelectorAll("input,select,textarea").forEach(i => i.addEventListener("input", showUC));
        showUC();
        const retype = () => { const oldMeas = measureOf(m); collect(); m.type = d.querySelector("#m_type").value; if (measureOf(m) !== oldMeas){ m.stock = ""; m.lowAt = ""; } render(); };
        d.querySelector("#m_type").addEventListener("change", retype);

        d.querySelector("#m_save").onclick = () => {
          collect();
          if (!m.name.trim()) return toast("Give it a name");
          m.name = m.name.trim();
          if (isNew) S.materials.push(m); else { const i = S.materials.findIndex(x => x.id === m.id); S.materials[i] = m; }
          save(); d.close(); toast("Saved"); route();
        };
        const del = d.querySelector("#m_del");
        if (del) del.onclick = async () => {
          const used = S.recipes.filter(r => r.waxId === m.id || r.wickId === m.id || r.vesselId === m.id || (r.fragrances || []).some(f => f.id === m.id) || (r.extras || []).some(x => x.id === m.id));
          if (!(await confirmBox(`Delete “${m.name}”?${used.length ? ` It is used in ${used.length} recipe(s), which will lose it.` : ""}`))) return;
          S.materials = S.materials.filter(x => x.id !== m.id);
          S.recipes.forEach(r => { ["waxId", "wickId", "vesselId"].forEach(k => { if (r[k] === m.id) r[k] = ""; }); r.fragrances = (r.fragrances || []).filter(f => f.id !== m.id); r.extras = (r.extras || []).filter(x => x.id !== m.id); });
          save(); toast("Deleted"); route();
        };
      });
  };
  render();
}

      <p class="small muted" style="margin-top:0">Add up your marketplace + payment processing percentages (e.g. transaction fee + card fee) and any fixed per-order fees. Check your platform's current fee page – they change.</p>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>Your data</h2>
    <p class="muted" style="margin-top:0">Everything is stored only in this browser on this device – nothing is uploaded. <b>Export a backup regularly</b> (and before clearing browser data or switching devices).</p>
    <p class="small muted">${S.lastBackup ? "Last backup: " + fmtDate(S.lastBackup.slice(0, 10)) : "No backup exported yet."}</p>
    <div class="btns">
      <button class="btn primary" id="exp">Export backup (.json)</button>
      ${IS_DEMO ? `<button class="btn" disabled title="Available in the full version">Import backup</button>` : `<label class="btn" for="imp">Import backup</label><input type="file" id="imp" accept=".json,application/json" hidden>`}
      ${S.materials.length ? "" : `<button class="btn" data-sample>Load example data</button>`}
      <button class="btn danger" id="wipe">Erase all data</button>
    </div>
    ${IS_DEMO ? `<p class="small muted">Demo backups can be imported into the full version, so nothing you enter here is lost. ${buyLink("Get the full version")}.</p>` : ""}
  </div>
  <p class="small muted" style="margin-top:16px">PourPrice ${VERSION}${IS_DEMO ? " · demo" : ""}. Calculations are estimates – always follow your wax and fragrance suppliers' guidance and do your own burn tests.</p>`;
  const onS = e => {
    const t = e.target; if (!t.dataset.s) return;
    S.settings[t.dataset.s] = t.dataset.num !== undefined ? (t.value === "" ? 0 : num(t.value)) : t.value;
    save();
    if (["unit", "currency", "theme"].includes(t.dataset.s)){ applyTheme(); route(); }
  };
  app.querySelector("#sf").addEventListener("input", onS);
  app.querySelector("#sp").addEventListener("input", onS);
  app.querySelector("#exp").onclick = () => {
    S.lastBackup = new Date().toISOString(); save();
    download("pourprice-backup-" + todayISO() + ".json", JSON.stringify({ app: "PourPrice", exported: S.lastBackup, data: S }, null, 2), "application/json");
    toast("Backup downloaded"); renderFoot();
  };
  const imp = app.querySelector("#imp");
  if (imp) imp.onchange = () => {
    const f = imp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const j = JSON.parse(rd.result); const d = j && j.data ? j.data : j;
        if (!d || !Array.isArray(d.materials) || !Array.isArray(d.recipes)) throw new Error("bad");
        const n = normalize(d);
        if (!(await confirmBox(`Replace your current data with this backup (${n.materials.length} materials, ${n.recipes.length} recipes, ${n.batches.length} batches)?`, "Replace"))) return;
        S = n; save(); applyTheme(); toast("Backup restored"); route();
      } catch(e){ toast("That file isn't a PourPrice backup"); }
      imp.value = "";
    };
    rd.readAsText(f);
  };
  const sb = app.querySelector("[data-sample]"); if (sb) sb.onclick = loadSample;
  app.querySelector("#wipe").onclick = async () => {
    if (!(await confirmBox("Erase ALL materials, recipes, batches and settings from this browser? Export a backup first if unsure.", "Erase everything"))) return;
    S = defaultState(); save(); applyTheme(); toast("All data erased"); route();
  };
}

/* ---------- example data ---------- */
function loadSample(){
  const id = {}; ["wax", "fo1", "fo2", "wick", "jar", "lid", "label"].forEach(k => id[k] = uid());
  const oz = G_PER.oz;
  S.materials.push(
    { id: id.wax, type: "wax", name: "Soy container wax (example)", pricePaid: 95, qtyPurchased: 50, qtyUnit: "lb", stock: 30 * G_PER.lb, lowAt: 5 * G_PER.lb, maxFl: 10, notes: "Example numbers – replace with your own." },
    { id: id.fo1, type: "fragrance", name: "Lavender (example)", pricePaid: 24, qtyPurchased: 16, qtyUnit: "oz", stock: 16 * oz, lowAt: 4 * oz, notes: "" },
    { id: id.fo2, type: "fragrance", name: "Vanilla (example)", pricePaid: 22, qtyPurchased: 16, qtyUnit: "oz", stock: 12 * oz, lowAt: 4 * oz, notes: "" },
    { id: id.wick, type: "wick", name: "Cotton wick, 6\" (example)", pricePaid: 12, qtyPurchased: 100, qtyUnit: "each", stock: 80, lowAt: 20, notes: "" },
    { id: id.jar, type: "vessel", name: "9 oz amber jar (example)", pricePaid: 36, qtyPurchased: 24, qtyUnit: "each", waterWeight: 9 * oz, stock: 24, lowAt: 6, notes: "" },
    { id: id.lid, type: "other", name: "Metal lid (example)", pricePaid: 9, qtyPurchased: 24, qtyUnit: "each", stock: "", lowAt: "", notes: "" },
    { id: id.label, type: "other", name: "Printed label (example)", pricePaid: 15, qtyPurchased: 100, qtyUnit: "each", stock: "", lowAt: "", notes: "" }
  );
  if (!(IS_DEMO && S.recipes.length >= DEMO_LIMITS.recipes))
    S.recipes.push({ id: uid(), name: "Lavender Vanilla – 9 oz jar", vesselId: id.jar, waxId: id.wax, fl: 8, fragrances: [{ id: id.fo1, pct: 70 }, { id: id.fo2, pct: 30 }], wickId: id.wick, wicksPerCandle: 1, extras: [{ id: id.lid, qty: 1 }, { id: id.label, qty: 1 }], laborMin: 6, price: "", fillOverride: "", notes: "Example recipe." });
  save(); toast("Example data loaded"); location.hash = "#recipes"; route();
}

/* ---------- chrome ---------- */
function applyTheme(){ const t = S.settings.theme; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
function renderFoot(){
  const f = document.getElementById("foot");
  const stale = !S.lastBackup || (Date.now() - Date.parse(S.lastBackup)) > 14 * 864e5;
  const hasData = S.recipes.length || S.batches.length;
  f.innerHTML = `${!storageOK ? `<div class="note bad">This browser is blocking storage, so changes may not be kept. Export a backup in Settings, or open PourPrice in a different browser.</div>` : ""}
    ${hasData && stale ? `<div class="note warn">Your data lives only in this browser. <a href="#settings">Export a backup</a> to keep it safe.</div>` : ""}
    PourPrice ${VERSION}${IS_DEMO ? ` · Free demo – ${buyLink("get the full version")}` : ""} · Your data stays on your device.`;
}
function init(){
  load(); applyTheme();
  if (IS_DEMO) document.getElementById("banner-slot").innerHTML = `<div class="banner">Free demo · save up to ${DEMO_LIMITS.recipes} recipes &amp; ${DEMO_LIMITS.batches} batches · ${buyLink("Unlock everything – one-time purchase")}</div>`;
  const _save = save; save = function(){ _save(); renderFoot(); };
  renderFoot(); route();
  if (typeof BUILD !== "undefined" && BUILD.sw && "serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register(BUILD.sw).catch(() => {});
}
init();
</script>
